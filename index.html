<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaipee House</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap');body{font-family:'Noto Sans Lao',sans-serif}</style>
</head>
<body class="bg-[#f5f5f5]">

<!-- โปรโมชั่น แก้ได้ในหลังบ้าน -->
<div id="promoBanner" class="bg-[#EE4D2D] text-white text-center py-2 text-[13px] font-bold hidden"></div>

<!-- HEADER -->
<div class="bg-white p-3 flex justify-between items-center sticky top-0 z-10 shadow-sm">
  <b class="text-[#EE4D2D] text-xl">Kaipee House</b>
  <button onclick="document.getElementById('adminPanel').classList.remove('hidden')" class="bg-black text-white px-4 py-1 rounded-full text-xs">หลังบ้าน</button>
</div>

<!-- แบนเนอร์ แก้ได้ในหลังบ้าน -->
<div id="bannerArea" class="max-w-[600px] mx-auto mt-2"></div>

<!-- สินค้า -->
<div id="products" class="max-w-[600px] mx-auto grid grid-cols-2 gap-2 p-2"></div>

<!-- กล่องบัญชี 132120001397874001 -->
<div class="max-w-[600px] mx-auto p-3">
<div class="bg-white border-2 border-dashed border-[#EE4D2D] rounded-2xl p-4">
  <div class="font-bold mb-2">📝 ຂໍ້ມູນໂອນ BCEL</div>
  <div class="bg-[#FFF7ED] p-3 rounded-xl flex justify-between items-center">
    <div><div class="text-[11px] text-gray-500">ເລກບັນຊີ</div><div class="font-extrabold text-[18px]">132120001397874001</div><div class="text-[13px]">kaipee Leuangkhamsone</div></div>
    <button onclick="navigator.clipboard.writeText('132120001397874001');alert('ຄັດລອກແລ້ວ ✓')" class="bg-black text-white text-xs px-4 py-2 rounded-full">ຄັດລອກ</button>
  </div>
  <div class="text-xs mt-2">WhatsApp: 020 28 28 78 08 | <a id="bioTikTokLink" href="#" class="text-[#EE4D2D] underline">TikTok</a></div>
</div>
</div>

<!-- ADMIN หลังบ้าน -->
<div id="adminPanel" class="hidden fixed inset-0 bg-[#f5f5f5] z-50 overflow-auto">
<div class="max-w-[600px] mx-auto bg-white min-h-screen p-4">
  <div class="flex justify-between mb-4"><h2 class="font-bold text-lg">ตั้งค่าหลังบ้าน</h2><button onclick="document.getElementById('adminPanel').classList.add('hidden')" class="bg-black text-white px-3 py-1 rounded-full text-xs">ปิด</button></div>

  <div class="bg-yellow-50 p-3 rounded-xl mb-4">
    <div class="font-bold text-sm mb-2">🎨 หน้า Settings - แก้ได้ตามใจ</div>
    <label class="text-[11px] font-bold">1. ข้อความโปรโมชั่น</label>
    <input id="promoText" class="w-full border p-2 rounded mb-1 text-sm" placeholder="ເຄື່ອງມີພ້ອມສົ່ງ">
    <label class="text-[11px]"><input type="checkbox" id="promoShow"> เปิดโชว์โปรโมชั่น</label>

    <label class="text-[11px] font-bold mt-3 block">2. รูปแบนเนอร์ (ใส่ลิงก์รูป 2-3 รูป คั่นด้วย, )</label>
    <textarea id="bannerImgs" class="w-full border p-2 rounded mb-2 text-sm h-16"></textarea>

    <label class="text-[11px] font-bold mt-3 block">3. แก้หน้าไบโอ - หัวข้อไบโอ</label>
    <input id="bioTitle" class="w-full border p-2 rounded mb-2 text-sm" placeholder="Kaipee House - ชุดนอนน่ารัก">
    <label class="text-[11px]">คำอธิบายไบโอ</label>
    <input id="bioDesc" class="w-full border p-2 rounded mb-2 text-sm" placeholder="กดลิงก์ด้านล่างเพื่อสั่ง">
    <label class="text-[11px]">ลิงก์ TikTok (หน้าไบโอ)</label>
    <input id="bioTikTok" class="w-full border p-2 rounded mb-2 text-sm" placeholder="https://tiktok.com/@...">
    <label class="text-[11px]">ลิงก์ WhatsApp</label>
    <input id="bioWA" class="w-full border p-2 rounded mb-3 text-sm">

    <button onclick="saveAll()" class="w-full bg-[#EE4D2D] text-white py-3 rounded-full font-bold">💾 บันทึกทั้งหมด</button>
    <div id="saveMsg" class="hidden text-center text-green-600 text-xs mt-2">บันทึกสำเร็จแล้ว ✓ กลับไปดูหน้าร้านได้เลย</div>
  </div>
</div>
</div>

<script>
const defaults={promoText:"🔥 ເຄື່ອງມີພ້ອມສົ່ງ ຊຸດນອນນ່າຮັກ",promoShow:true,bannerImgs:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f,https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af",bioTitle:"Kaipee House",bioDesc:"ເຄື່ອງແຟຊັ່ນ ນ່າຮັກ ພ້ອມສົ່ງ",bioTikTok:"https://tiktok.com",bioWA:"020 28 28 78 08"};
const products=[{name:"ชุดนอนแมว",price:299000,img:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f"},{name:"หมวกบักเก็ต",price:99000,img:"https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af"}];

function load(){
  const s=JSON.parse(localStorage.getItem('kaipee_settings')||'null')||defaults;
  if(s.promoShow){const e=document.getElementById('promoBanner');e.innerText=s.promoText;e.classList.remove('hidden');}
  document.getElementById('bannerArea').innerHTML=s.bannerImgs.split(',').map(u=>u.trim()?`<img src="${u}" class="w-full h-52 object-cover rounded-xl mb-2">`:'').join('');
  document.getElementById('bioTikTokLink').href=s.bioTikTok;
  document.getElementById('products').innerHTML=products.map(p=>`<div class="bg-white rounded-xl p-2"><img src="${p.img}" class="h-32 w-full object-cover rounded"><div class="text-xs mt-1 font-bold">${s.bioTitle} - ${p.name}</div><div class="text-[#EE4D2D] font-bold">₭${p.price.toLocaleString()}</div><div class="text-[11px] text-gray-500">${s.bioDesc}</div></div>`).join('');
  // fill form
  document.getElementById('promoText').value=s.promoText;document.getElementById('promoShow').checked=s.promoShow;document.getElementById('bannerImgs').value=s.bannerImgs;document.getElementById('bioTitle').value=s.bioTitle;document.getElementById('bioDesc').value=s.bioDesc;document.getElementById('bioTikTok').value=s.bioTikTok;document.getElementById('bioWA').value=s.bioWA;
}
function saveAll(){
  const s={promoText:promoText.value,promoShow:promoShow.checked,bannerImgs:bannerImgs.value,bioTitle:bioTitle.value,bioDesc:bioDesc.value,bioTikTok:bioTikTok.value,bioWA:bioWA.value};
  localStorage.setItem('kaipee_settings',JSON.stringify(s));saveMsg.classList.remove('hidden');setTimeout(()=>location.reload(),800);
}
load();
</script>
</body>
</html>
