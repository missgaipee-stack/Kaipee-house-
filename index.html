<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaipee House</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans Lao',sans-serif}</style>
</head>
<body class="bg-[#FFF7ED]">
<header class="bg-white p-4 shadow flex justify-between items-center sticky top-0">
  <b class="flex items-center gap-2"><span class="w-8 h-8 bg-[#FF5722] text-white rounded-full flex items-center justify-center">K</span>Kaipee House</b>
  <a href="links.html" class="text-xs bg-gray-100 px-3 py-1 rounded-full">Links</a>
</header>
<div class="max-w-[480px] mx-auto p-4">
<div class="bg-[#FF5722] text-white rounded-2xl p-5">
<h1 class="text-xl font-bold">ເຄື່ອງໃຊ້ຄົວເຮືອນ ຄຸນນະພາບດີ</h1>
<p class="text-sm opacity-90">ສັ່ງໃນ WhatsApp 020 28 28 78 08 - ສົ່ງຟຣີໃນ ນະຄອນຫຼວງ</p>
</div>
<div id="list" class="grid grid-cols-2 gap-3 mt-5"></div>
</div>
<script>
const products=[
{name:"ໝໍ້ຫຸງເຂົ້າໄຟຟ້າ",price:250000,image:"https://images.unsplash.com/photo-1585515656676-6c0c7b5f6c1b?w=400",tag:"ຂາຍດີ"},
{name:"ກະຕິກນ້ຳຮ້ອນ",price:120000,image:"https://images.unsplash.com/photo-1544787219-7f47cc556762?w=400",tag:"ໃໝ່"},
{name:"ຊຸດມີດຄົວ",price:89000,image:"https://images.unsplash.com/photo-1593618229886-fe84b849bc7f?w=400",tag:""},
{name:"ໝໍ້ທອດໄຮ້ມັນ",price:450000,image:"https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=400",tag:"ລົດລາຄາ"}
];
const list=document.getElementById('list');
products.forEach(p=>{
const link=`https://wa.me/8562028287808?text=ສະບາຍດີ%20Kaipee%20House%20ສົນໃຈ%20${encodeURIComponent(p.name)}`;
list.innerHTML+=`<div class="bg-white rounded-xl p-2 shadow"><img src="${p.image}" class="w-full h-32 object-cover rounded-lg"><div class="p-1"><h3 class="text-sm font-bold">${p.name}</h3><p class="text-[#FF5722] font-bold text-sm">${p.price.toLocaleString()} ກີບ</p><a href="${link}" target="_blank" class="block bg-green-500 text-white text-center text-xs font-bold py-2 rounded-full mt-2">ສັ່ງ WhatsApp</a></div></div>`;
});
</script>
</body>
</html>
