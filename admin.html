<!DOCTYPE html>
<html lang="lo"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaipee shop</title><script src="https://cdn.tailwindcss.com"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@500;700;900&display=swap');body{font-family:'Noto Sans Lao',sans-serif;background:#f5f5f7}</style></head><body>

<!-- HEADER เหมือนเดิมเป๊ะ -->
<div class="bg-[#E34A27] text-white p-3 flex justify-between items-center sticky top-0 z-10">
<div class="flex items-center gap-2">
<button onclick="document.getElementById('admin').classList.remove('hidden')" class="bg-white/20 backdrop-blur px-3 py-2 rounded-[12px] text-[11px] leading-tight text-center">ສະອັບປ່ຽນ<br>ທົ່ວໄປ<br>(Admin)</button>
<div class="flex items-center gap-1 ml-2"><span class="text-[20px]">👜</span><b class="text-[19px] leading-none">Kaipee<br>shop</b></div>
<div class="bg-white/20 text-[11px] px-2.5 py-1 rounded-full ml-1">ລາວ (Lao) ◇</div>
</div>
<div class="relative text-[26px]">🛒<span class="absolute -top-1 -right-2 bg-white text-red-600 text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span></div>
</div>

<!-- BANNER เหมือนเดิม แต่แก้ข้อความได้แล้ว - ตรงที่คุณวงสีเขียว -->
<div class="bg-gradient-to-br from-[#FF7A2E] to-[#FF9E2B] max-w-[95%] mx-auto mt-3 rounded-[22px] p-5 text-white relative min-h-[320px]">
<div class="bg-white/20 inline-block px-3 py-1 rounded-full text-[12px]" id="b_badge">MEGA SALE 5.5</div>
<div class="mt-4 text-[28px] font-bold leading-[1.1]" id="b_title">ສິນຄ້າລາຄາພິເສດ ຫຼຸດ</div>
<div class="text-[44px] font-black leading-none mt-1" id="b_disc">ສູງສຸດ 80%</div>
<div class="text-[13px] opacity-90 mt-3 leading-snug max-w-[75%]" id="b_desc">ໂອນສົ່ງ ສປປ ລາວ ຮອງຮັບການຊໍາລະຜ່ານ BCEL OnePay</div>
<button class="bg-white text-[#E34A27] px-5 py-2.5 rounded-full font-bold text-[14px] mt-5" id="b_btn">ຊື້ເລີຍຕອນນີ້</button>
<img id="b_img" class="absolute right-2 bottom-2 w-28 h-28 object-contain opacity-80 hidden">
</div>

<div class="max-w-[95%] mx-auto p-3 mt-2"><b>ໝວດໝູ່ ສິນຄ້າ (CATEGORIES)</b></div>

<!-- ADMIN แก้ตรงที่วงสีเขียวได้ -->
<div id="admin" class="hidden fixed inset-0 bg-white z-50 overflow-auto p-4">
<div class="max-w-[600px] mx-auto">
<div class="flex justify-between items-center mb-4"><h2 class="font-bold">แก้ข้อความแบนเนอร์</h2><button onclick="document.getElementById('admin').classList.add('hidden')" class="bg-black text-white px-4 py-1 rounded-full text-xs">ปิด X</button></div>

<div class="bg-[#FFF7ED] border-2 border-dashed border-orange-300 p-4 rounded-2xl">
<label class="text-xs font-bold">ข้อความเล็กบนสุด</label><input id="e_badge" class="w-full border p-2.5 rounded-xl mb-3 text-sm">
<label class="text-xs font-bold">ข้อความใหญ่ (ตรงที่คุณวงสีเขียว บรรทัดบน)</label><input id="e_title" class="w-full border p-2.5 rounded-xl mb-3 text-sm">
<label class="text-xs font-bold">ข้อความลดราคาใหญ่ๆ (80%)</label><input id="e_disc" class="w-full border p-2.5 rounded-xl mb-3 text-sm font-black">
<label class="text-xs font-bold">คำอธิบายเล็กๆ</label><input id="e_desc" class="w-full border p-2.5 rounded-xl mb-3 text-sm">
<label class="text-xs font-bold">ข้อความบนปุ่ม</label><input id="e_btn" class="w-full border p-2.5 rounded-xl mb-3 text-sm">
<label class="text-xs font-bold">ลิงก์รูป (ถ้าอยากเอารูปขึ้น)</label><input id="e_img" class="w-full border p-2.5 rounded-xl mb-4 text-sm" placeholder="https://...">

<button onclick="saveB()" class="w-full bg-[#E34A27] text-white py-3.5 rounded-full font-bold">💾 บันทึก</button>
<div id="ok" class="hidden text-center text-green-600 font-bold mt-2">บันทึกแล้ว ✓</div>
</div>
</div>
</div>

<script>
const D={badge:"MEGA SALE 5.5",title:"ສິນຄ້າລາຄາພິເສດ ຫຼຸດ",disc:"ສູງສຸດ 80%",desc:"ໂອນສົ່ງ ສປປ ລາວ ຮອງຮັບການຊໍາລະຜ່ານ BCEL OnePay",btn:"ຊື້ເລີຍຕອນນີ້",img:""};
function loadB(){const s=JSON.parse(localStorage.getItem('kb')||'null')||D;document.getElementById('b_badge').innerText=s.badge;document.getElementById('b_title').innerText=s.title;document.getElementById('b_disc').innerText=s.disc;document.getElementById('b_desc').innerText=s.desc;document.getElementById('b_btn').innerText=s.btn;if(s.img){document.getElementById('b_img').src=s.img;document.getElementById('b_img').classList.remove('hidden');}e_badge.value=s.badge;e_title.value=s.title;e_disc.value=s.disc;e_desc.value=s.desc;e_btn.value=s.btn;e_img.value=s.img;}
function saveB(){const s={badge:e_badge.value,title:e_title.value,disc:e_disc.value,desc:e_desc.value,btn:e_btn.value,img:e_img.value};localStorage.setItem('kb',JSON.stringify(s));ok.classList.remove('hidden');loadB();setTimeout(()=>document.getElementById('admin').classList.add('hidden'),700);}
loadB();
</script>
</body></html>
